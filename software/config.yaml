# ReMO 자율주행 설정 (Raspberry Pi 5)
# 단위: 길이 mm, 각도 deg, 속도 mm/s, 각속도 rad/s
# "TODO 실측" 표시는 차체 조립 후 실제 값으로 바꿔야 함

loop_hz: 15

robot:
  width_mm: 260            # TODO 실측: 바퀴 바깥쪽 끝 기준 차체 폭
  length_mm: 320           # TODO 실측: 앞뒤 범퍼 기준 길이
  eccentric_offset_mm: 30  # 편심량 e
  # 넘을 수 있는 최대 턱 높이. 이론상 2e = 60mm, 안전 여유를 두고 50mm
  climb_limit_mm: 50

motion:
  cruise_speed: 200
  slow_speed: 90
  climb_speed: 80
  fault_speed: 80          # OpenCR가 바퀴 고장을 보고하면 이 속도로 제한
  max_turn_rate: 1.2
  heading_gain: 2.0        # w = gain * (목표 방향 - 현재 방향)
  turn_in_place_deg: 40    # 목표 방향이 이보다 크게 틀어지면 제자리 회전 먼저

safety:
  stop_distance_mm: 150    # 범퍼에서 이 거리 안에 넘을 수 없는 장애물 → 정지/회피
  slow_distance_mm: 600    # 이 거리부터 감속하고 장애물 판단 시작
  lookahead_mm: 650        # 후보 방향이 이만큼 비어 있어야 "통과 가능"
  side_margin_mm: 50       # 차체 폭 양옆 여유
  max_tilt_deg: 20         # 턱 넘기 중이 아닐 때 이 이상 기울면 정지
  cmd_timeout_s: 0.5       # OpenCR 쪽 워치독 (문서용, OpenCR 펌웨어에서 구현)

decision:
  low_gap_mm: 120          # (키 큰 장애물 거리 - 가장 가까운 장애물 거리) > 이 값이면 "낮은 턱"
  confirm_frames: 3        # 같은 판단이 연속 N 프레임 나와야 확정
  climb_trigger_mm: 90     # 낮은 턱까지 이 거리면 OpenCR에 턱 넘기 모드 요청
  climb_max_s: 15.0        # 턱 넘기 최대 시간 (넘으면 정지). 턱 깊이 + 차체 길이를 지나는 시간보다 길게
  climb_enabled: true
  goal_align_deg: 20       # 목표 방향과 이 이내로 정렬돼 있을 때만 턱 넘기 시도

lidar:
  enabled: true
  port: /dev/ttyUSB0       # D500 USB 어댑터 (CP210x). ls /dev/ttyUSB* 로 확인
  baud: 230400
  x_mm: 60                 # 로봇 중심 기준 장착 위치 (전방 +)
  y_mm: 0
  height_mm: 150           # 지면 기준 스캔면 높이 — 이보다 낮은 장애물은 라이다에 안 보임
  angle_offset_deg: 0      # 라이다 0° 방향이 로봇 정면과 다르면 보정
  clockwise: true          # LD19/D500은 시계 방향 각도
  min_range_mm: 30
  max_range_mm: 6000
  self_filter_mm: 30       # 차체 안쪽(자기 몸) 점 제거 여유

tof:
  enabled: true
  driver: vl53l0x          # 받은 ToF 칩 이름 확인 후 vl53l0x / vl53l1x 선택
  x_mm: 160                # 앞 범퍼에 장착
  y_mm: 0
  # 높이 게이트: 수평으로 climb_limit 높이에 달면, ToF에 잡히는 것 = 넘을 수 없는 높이
  height_mm: 50
  max_range_mm: 1200
  fov_deg: 25              # VL53L0X 시야각 ≈ 25°

camera:
  enabled: true
  device: 0                # /dev/video0
  width: 320
  height: 240
  x_mm: 120
  height_mm: 180           # 카메라 렌즈 높이
  tilt_deg: 30             # 아래로 숙인 각도
  hfov_deg: 60             # 로지텍 C270 계열 ≈ 60°
  bands: 16                # 화면을 세로 띠 N개로 나눠 띠마다 장애물 거리 추정
  floor_thresh: 18.0       # 바닥 색과의 Lab 색 거리 임계값 (조명에 맞춰 튜닝)
  min_range_mm: 150
  max_range_mm: 1500

opencr:
  port: /dev/ttyACM0
  baud: 115200
  # HC-SR04 ×3 (OpenCR J3 58–63) 값은 OpenCR가 상태 메시지로 올려줌
  ultrasonic:
    enabled: true
    height_mm: 40
    max_range_mm: 1500
    sensors:               # [x_mm, y_mm, 방향 deg(좌 +)]
      - [150, 90, 30]      # 좌전방
      - [160, 0, 0]        # 정면
      - [150, -90, -30]    # 우전방

log:
  enabled: true
  dir: logs
